<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1M Checkbox</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    #container {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 0.5rem;
      margin-top: 1rem;
    }
    #error {
      display: none;
      color: #b91c1c;
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <h1>1M Checkbox</h1>
  <p>Click a checkbox. Changes sync live across every connected client and every running server instance.</p>
  <div id="error"></div>
  <div id="container"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
