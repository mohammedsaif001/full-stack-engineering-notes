services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: advanced-rag-qdrant
    restart: unless-stopped
     ports:
      - "6333:6333" # REST API
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: advanced-rag-redis
    restart: unless-stopped
    ports:
      - "6379:6379" # Redis
    volumes:
      - redis_data:/data  

volumes:
  qdrant_data:
  redis_data: